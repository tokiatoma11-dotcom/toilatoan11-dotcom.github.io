<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập - Minh Khang Technology</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="topbar">
  <div class="logo">Website của tôi</div>
  <nav>
    <a href="index.html">Trang chủ</a>
    <a href="video.html">Video</a>
  </nav>
</header>

<main class="hero" style="padding-top: 40px;">
  <div class="auth-box">
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabDangNhap" onclick="chuyenTab('dangnhap')">Đăng nhập</button>
      <button class="auth-tab" id="tabDangKy" onclick="chuyenTab('dangky')">Đăng ký</button>
    </div>

    <form id="formDangNhap" class="auth-form">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Mật khẩu" required minlength="6">
      <button type="submit" class="btn-primary" style="width:100%;">Đăng nhập</button>
      <p class="auth-msg" id="loginMsg"></p>
    </form>

    <form id="formDangKy" class="auth-form" style="display:none;">
      <input type="text" id="regHoTen" placeholder="Họ và tên" required>
      <input type="email" id="regEmail" placeholder="Email" required>
      <input type="password" id="regPassword" placeholder="Mật khẩu (ít nhất 6 ký tự)" required minlength="6">
      <button type="submit" class="btn-primary" style="width:100%;">Đăng ký</button>
      <p class="auth-msg" id="regMsg"></p>
    </form>
  </div>
</main>

<footer class="footer">
  © 2026 Website của tôi. Được host trên GitHub Pages.
</footer>

<script src="assets/auth.js"></script>
</body>
        </html>
